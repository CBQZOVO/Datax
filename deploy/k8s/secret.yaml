# 敏感配置：部署前请用真实值替换以下占位符
# 生成方式：echo -n "$(openssl rand -hex 32)"  或  openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: datax-secret
  namespace: datax
type: Opaque
stringData:
  # JWT 签名密钥（生产必改）
  JWT_SECRET: "please-replace-with-your-own-random-secret"
  # AES-256-GCM 密钥派生源（任意长度字符串，用于加密数据源密码；生产必改）
  SECRET_KEY: "please-replace-with-your-own-random-secret"
  # 初始管理员（仅首次启动生效）
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "please-change-me"
  # AI 安全审计 Key（留空则仅使用内置规则引擎）
  AI_API_KEY: ""
  # Agent 只读通道静态令牌（逗号分隔可多个；生成：openssl rand -hex 32）
  # 留空 = agent 通道禁用
  AGENT_TOKEN: ""
