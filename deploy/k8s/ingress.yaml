apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datax-ingress
  namespace: datax
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: datax.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: datax-web
                port:
                  number: 80
  # 生产环境建议启用 TLS：
  # tls:
  #   - hosts:
  #       - datax.example.com
  #     secretName: datax-tls
