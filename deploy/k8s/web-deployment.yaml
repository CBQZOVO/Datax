apiVersion: apps/v1
kind: Deployment
metadata:
  name: datax-web
  namespace: datax
  labels:
    app: datax-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: datax-web
  template:
    metadata:
      labels:
        app: datax-web
    spec:
      containers:
        - name: web
          image: datax-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: datax-web
  namespace: datax
spec:
  selector:
    app: datax-web
  ports:
    - port: 80
      targetPort: 80
      name: http
